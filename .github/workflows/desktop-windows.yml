name: Desktop-App (Windows)

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'index.html', 'css/**', 'js/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: WebView2-SDK installieren (NuGet)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -Trusted | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -Source nugetRepository -Force -SkipDependencies
          Get-ChildItem "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages" | Select-Object Name

      - name: JUCE-Cache
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.6-${{ runner.os }}

      - name: Konfigurieren
        run: cmake -S desktop -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Klangwerk_artefacts/Release/Klangwerk.exe out/
          Copy-Item desktop/README.md out/LIESMICH.md
          Compress-Archive -Path out/* -DestinationPath Klangwerk-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Klangwerk-Windows
          path: Klangwerk-Windows.zip

      - name: An Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Klangwerk-Windows.zip --clobber
